name: college_bus_tracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Services
  firebase_core: ^3.0.0
  firebase_database: ^11.0.0

  # Maps & Background Tracking
  google_maps_flutter: ^2.5.0
  geolocator: ^13.0.0
  flutter_background_service: ^5.0.0
  permission_handler: ^11.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/bus_icon.png
    - assets/sathyabama_logo.png